name: Visual Preview

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/portfolio-server.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          FLAGS="--headless=new --no-sandbox --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage"
          "$CHROME" $FLAGS --window-size=1440,1100 --virtual-time-budget=14000 --screenshot=preview-desktop.png http://127.0.0.1:4173/ 2>chrome-desktop.log
          "$CHROME" $FLAGS --window-size=390,844 --virtual-time-budget=14000 --screenshot=preview-mobile.png http://127.0.0.1:4173/ 2>chrome-mobile.log
          test -s preview-desktop.png
          test -s preview-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: |
            preview-desktop.png
            preview-mobile.png
            chrome-desktop.log
            chrome-mobile.log
