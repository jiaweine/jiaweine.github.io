name: Visual Preview

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2

concurrency:
  group: visual-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/portfolio-server.log 2>&1 &
          sleep 2
      - name: Capture desktop and mobile hero
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          FLAGS="--headless=new --no-sandbox --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage"
          capture () {
            local size="$1" file="$2"
            "$CHROME" $FLAGS --window-size="$size" --virtual-time-budget=9000 --screenshot="$file" http://127.0.0.1:4173/ 2>>chrome.log
            test -s "$file"
          }
          capture 1440,1100 preview-desktop.png
          capture 390,844 preview-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: |
            preview-desktop.png
            preview-mobile.png
            chrome.log
