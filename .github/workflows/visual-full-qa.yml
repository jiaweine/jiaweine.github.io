name: Full Page Visual QA

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2
    paths:
      - 'index.html'
      - 'portfolio.js'
      - 'portfolio.css'
      - 'refine-v3.css'
      - '.github/workflows/visual-full-qa.yml'

concurrency:
  group: full-page-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/full-qa-server.log 2>&1 &
          sleep 2
      - name: Capture key sections
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          FLAGS="--headless=new --no-sandbox --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage"
          capture () {
            local size="$1" file="$2" url="$3"
            "$CHROME" $FLAGS --window-size="$size" --virtual-time-budget=8500 --screenshot="$file" "$url" 2>>chrome-full.log
            test -s "$file"
          }
          capture 1440,1100 qa-focus.png http://127.0.0.1:4173/#focus
          capture 1440,1100 qa-work.png http://127.0.0.1:4173/#work
          capture 1440,1100 qa-stack.png http://127.0.0.1:4173/#stack
          capture 390,844 qa-mobile-focus.png http://127.0.0.1:4173/#focus
      - uses: actions/upload-artifact@v4
        with:
          name: full-page-visual-qa
          path: |
            qa-focus.png
            qa-work.png
            qa-stack.png
            qa-mobile-focus.png
            chrome-full.log
