name: Import avatar video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-avatar-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download avatar loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/avatar
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c62883dc-3376-4a66-a31d-9532e31c0505.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDgwMGI5MGEwNTdjYTZkYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4ODM1NTcyMn0.nF7d40_LCZZTfNjwAMt9_Gx_2nixk7viOZJHyupa2Kw' \
            -o assets/avatar/avatar.mp4
          test -s assets/avatar/avatar.mp4

      - name: Commit avatar asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/avatar/avatar.mp4
          if git diff --cached --quiet; then
            echo 'Avatar video already current.'
            exit 0
          fi
          git commit -m 'Add homepage avatar video loop'
          git push origin HEAD:main
