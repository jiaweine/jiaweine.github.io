name: Remove static hero photo

on:
  push:
    paths:
      - '.github/workflows/remove-static-hero-photo.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove static portrait fallback and bump hero cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('  <link rel="preload" href="./assets/digital-human.webp?v=clean-hero-1" as="image" type="image/webp" />\n', '')
          s = s.replace('          <img class="avatar-fallback" src="./assets/digital-human.webp?v=clean-hero-1" alt="Digital portrait of Jiawei Wang wearing white headphones" width="768" height="1024" />\n', '')
          s = s.replace('./video-avatar.css?v=clean-hero-1', './video-avatar.css?v=no-photo-1')
          s = s.replace('./video-avatar.js?v=clean-hero-1', './video-avatar.js?v=no-photo-1')
          p.write_text(s)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove static portrait from homepage hero"
          git push
