name: Rocketbox Male Contact Sheet

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2
    paths:
      - .github/workflows/rocketbox-candidates.yml

permissions:
  contents: read

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build official preview contact sheet
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os, urllib.request
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          root='/tmp/rocketbox-males'
          os.makedirs(root, exist_ok=True)
          imgs=[]
          for i in range(1,22):
              n=f'{i:02d}'
              url=f'https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_{n}/Male_Adult_{n}.png'
              path=f'{root}/{n}.png'
              urllib.request.urlretrieve(url,path)
              im=Image.open(path).convert('RGB')
              # crop upper half to emphasize face / hair / age while preserving enough clothing context
              w,h=im.size
              crop=im.crop((0,0,w,int(h*.72)))
              crop=ImageOps.contain(crop,(280,250),Image.Resampling.LANCZOS)
              tile=Image.new('RGB',(300,300),(18,20,19))
              x=(300-crop.width)//2; y=8
              tile.paste(crop,(x,y))
              d=ImageDraw.Draw(tile)
              d.rectangle((0,260,300,300),fill=(10,12,11))
              d.text((14,272),f'Male_Adult_{n}',fill=(232,235,232))
              imgs.append(tile)
          cols=4; rows=(len(imgs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*300,rows*300),(7,9,8))
          for idx,tile in enumerate(imgs):
              sheet.paste(tile,((idx%cols)*300,(idx//cols)*300))
          sheet.save('rocketbox-male-contact-sheet.jpg',quality=92,optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbox-male-contact-sheet
          path: rocketbox-male-contact-sheet.jpg
