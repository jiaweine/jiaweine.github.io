name: Build Rocketbox Portrait Asset

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2
    paths:
      - .github/workflows/build-rocketbox.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/high-fidelity-3d-redesign-v2
      - name: Install Blender and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender imagemagick
          blender --version | tee /tmp/blender-version.txt
      - name: Download Microsoft Rocketbox Asian male source
        run: |
          mkdir -p /tmp/rocketbox assets
          BASE='https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_10'
          curl -L --fail "$BASE/Export/Male_Adult_10_facial.fbx" -o /tmp/rocketbox/Male_Adult_10_facial.fbx
          for file in \
            m024_body_color.tga \
            m024_body_normal.tga \
            m024_body_specular.tga \
            m024_head_color.tga \
            m024_head_normal.tga \
            m024_head_specular.tga \
            m024_opacity_color.tga; do
            curl -L --fail "$BASE/Textures/$file" -o "/tmp/rocketbox/$file"
          done
      - name: Resize source textures
        run: |
          for f in /tmp/rocketbox/*.tga; do
            out="${f%.tga}.small.tga"
            convert "$f" -resize '1024x1024>' "tga:$out"
            mv "$out" "$f"
          done
          identify /tmp/rocketbox/*.tga | tee /tmp/texture-info.txt
      - name: Convert FBX to web GLB
        id: convert
        shell: bash
        run: |
          cat > /tmp/export_rocketbox.py <<'PY'
          import bpy, os, traceback
          src='/tmp/rocketbox/Male_Adult_10_facial.fbx'
          out=os.path.abspath('assets/rocketbox-male10.glb')
          print('BLENDER', bpy.app.version_string)
          print('IMPORT_OP', bpy.ops.import_scene.fbx)
          print('EXPORT_OP', bpy.ops.export_scene.gltf)
          try:
              bpy.ops.wm.read_factory_settings(use_empty=True)
              result=bpy.ops.import_scene.fbx(filepath=src, use_image_search=True)
              print('IMPORT_RESULT', result)
              print('OBJECTS', [(o.name, o.type) for o in bpy.context.scene.objects])
              print('IMAGES', [(i.name, i.filepath, tuple(i.size)) for i in bpy.data.images])
              result=bpy.ops.export_scene.gltf(
                  filepath=out,
                  export_format='GLB',
                  export_yup=True,
                  export_animations=False
              )
              print('EXPORT_RESULT', result)
              print('WROTE', out, os.path.getsize(out))
          except Exception:
              traceback.print_exc()
              raise
          PY
          set +e
          blender --background --python /tmp/export_rocketbox.py > /tmp/blender.log 2>&1
          status=$?
          set -e
          cat /tmp/blender.log
          if [ $status -ne 0 ]; then
            echo "Blender conversion failed with $status"
            exit $status
          fi
          ls -lh assets/rocketbox-male10.glb | tee /tmp/output-info.txt
      - name: Upload conversion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketbox-build-diagnostics
          path: |
            /tmp/blender.log
            /tmp/blender-version.txt
            /tmp/texture-info.txt
            /tmp/output-info.txt
          if-no-files-found: ignore
      - name: Add attribution
        if: steps.convert.outcome == 'success'
        run: |
          cat > assets/rocketbox-male10-LICENSE.txt <<'TXT'
          Microsoft Rocketbox asset derived from microsoft/Microsoft-Rocketbox.
          Copyright (c) 2020 Microsoft.
          Licensed under the MIT License.
          Source: Assets/Avatars/Adults/Male_Adult_10.
          TXT
      - name: Commit generated web asset
        if: steps.convert.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rocketbox-male10.glb assets/rocketbox-male10-LICENSE.txt
          git commit -m 'Add optimized Rocketbox Asian male portrait asset'
          git push origin HEAD:agent/high-fidelity-3d-redesign-v2
