name: Inspect Vitruvian Hair Cards

on:
  push:
    branches:
      - agent/high-fidelity-3d-redesign-v2
    paths:
      - .github/workflows/inspect-vitruvian-hair.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hair preview page
        run: |
          cat > hair-preview.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0a}</style>
          <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><div id="app"></div><script type="module">
          import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
          const app=document.getElementById('app');const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;app.appendChild(r.domElement);
          const s=new THREE.Scene();s.background=new THREE.Color(0x090b0a);const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;const c=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);
          s.add(new THREE.HemisphereLight(0xffffff,0x101312,1.8));const k=new THREE.DirectionalLight(0xffffff,4);k.position.set(-3,5,5);s.add(k);const rim=new THREE.DirectionalLight(0x9fc4ff,4);rim.position.set(4,3,-3);s.add(rim);
          new GLTFLoader().load('https://cdn.jsdelivr.net/gh/ibrews/VitruvianGodot@main/godot_project/hairtool_cards.glb',g=>{const root=g.scene;s.add(root);root.traverse(o=>{if(!o.isMesh)return;const old=Array.isArray(o.material)?o.material:[o.material];o.material=old.map(m=>{const n=m.clone();n.color?.set(0x131516);if('roughness'in n)n.roughness=.52;if('metalness'in n)n.metalness=.02;n.side=THREE.DoubleSide;n.transparent=false;n.alphaTest=Math.max(n.alphaTest||0,.15);return n});if(o.material.length===1)o.material=o.material[0]});
          const b=new THREE.Box3().setFromObject(root),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());root.position.sub(center);const max=Math.max(size.x,size.y,size.z);c.position.set(max*.08,max*.03,max*2.15);c.lookAt(0,0,0);console.log('HAIR_BOUNDS',size.x,size.y,size.z);requestAnimationFrame(()=>{r.render(s,c);document.body.dataset.ready='1'})},undefined,e=>console.error(e));
          </script></body></html>
          HTML
          python3 -m http.server 4173 >/tmp/hair-server.log 2>&1 &
          sleep 2
      - name: Capture WebGL hair preview
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          FLAGS="--headless=new --no-sandbox --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-dev-shm-usage"
          "$CHROME" $FLAGS --window-size=720,720 --virtual-time-budget=12000 --screenshot=vitruvian-hair-cards.png http://127.0.0.1:4173/hair-preview.html 2>hair-chrome.log
          test -s vitruvian-hair-cards.png
      - uses: actions/upload-artifact@v4
        with:
          name: vitruvian-hair-cards-preview
          path: |
            vitruvian-hair-cards.png
            hair-chrome.log
